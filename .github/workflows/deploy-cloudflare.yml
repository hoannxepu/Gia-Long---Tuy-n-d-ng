name: Triển Khai Tự Động Lên Cloudflare Pages & Workers

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '*.md'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: 📥 1. Checkout Mã Nguồn
        uses: actions/checkout@v4

      - name: ⚙️ 2. Cài Đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 3. Cài Đặt Phụ Thuộc (npm install)
        run: npm ci || npm install

      - name: 🛠️ 4. Build Ứng Dụng (Web & Extension)
        run: npm run build

      - name: 🚀 5. Triển Khai Lên Cloudflare Pages
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ${{ secrets.CLOUDFLARE_PROJECT_NAME || 'gia-long---tuy-n-d-ng' }}
          directory: dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
